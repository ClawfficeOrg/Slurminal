[package]
name = "slurminal"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
gpui-kit = { version = "0.6", features = ["component", "assets"] }
gpui = { package = "gpui-pre", version = "0.3" }
zoid-gpui = { path = "vendor/zoid-gpui" }
zoid-core = { path = "vendor/zoid-core" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_System_Power"] }

[dev-dependencies]
gpui-kit = { version = "0.6", features = ["test-support"] }
gpui = { package = "gpui-pre", version = "0.3", features = ["test-support"] }
